services:

  mongodb:
    image: mongo:latest
    container_name: test-mongodb
    restart: unless-stopped
    ports:
      - "5006:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    image: kuldeepofficial/test-backend:latest
    platform: linux/amd64
    container_name: test-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env

  frontend:
    image: kuldeepofficial/test-frontend:latest
    platform: linux/amd64
    container_name: test-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"

volumes:
  mongo_data: