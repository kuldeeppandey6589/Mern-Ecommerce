name: CICD Pipeline

on:
  push:
    branches:
      - '**'

permissions:
  contents: read
  packages: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set Image Name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> $GITHUB_ENV

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          docker build -t $IMAGE .

      - name: Push
        run: |
          docker push $IMAGE


  deploy:
    needs: build
    runs-on: self-hosted

    steps:

      - name: Set Image Name
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> $GITHUB_ENV

      - name: Check Docker
        run: |
          docker --version
          docker ps

      - name: Check ENV
        run: |
          test -f /opt/inventory/.env || {
            echo "ERROR: /opt/inventory/.env not found"
            exit 1
          }

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Image
        run: |
          docker pull $IMAGE

      - name: Deploy
        run: |
          docker rm -f inventory-app || true

          docker run -d \
            --name inventory-app \
            --restart unless-stopped \
            -p 127.0.0.1:3000:3000 \
            --env-file /opt/inventory/.env \
            $IMAGE

      - name: Check Container
        run: |
          sleep 5
          docker ps -a
          docker logs inventory-app --tail 100